name: 更新指数

# 主触发：cron-job.org 在美东 9–16 点定时调用 workflow_dispatch（force=false）。
# GitHub 自带的定时任务实测一天只触发了约 2 次，只留作备用。
# 是否真正更新由 ci.py 按纽交所日历判断（盘前、休市、收盘版已完成时直接跳过）。
# 改了代码或网页模板后推送到 main，会立即重新计算并发布一次。
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: 不管是否开盘都更新一次
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [semi_fgi.py, ci.py, template.html, requirements.txt, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

# 新触发的运行直接取代还没跑完的旧运行：数据只要最新的，
# 也避免某次发布卡住时后面的运行全部排队。收盘版如果被中途取代，下一次触发会重做
concurrency:
  group: update
  cancel-in-progress: true

env:
  LIVE_URL: https://api.github.com/repos/${{ github.repository }}/contents/live.json?ref=live

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.run.outputs.pages }}
    steps:
      - uses: actions/checkout@v5

      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 依赖装在 .venv 里整体缓存，比每次 pip install 快约 10 秒
      - id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - id: day
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      # 历史行情每天全量下载一次，当天后续运行复用
      - uses: actions/cache@v4
        with:
          path: cache
          key: prices-${{ steps.day.outputs.date }}
          restore-keys: prices-

      - id: run
        env:
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
        run: .venv/bin/python ci.py

      # 网页读的就是这个分支上的 live.json。每次用一个新的单独提交强制覆盖，分支不积累历史
      - name: 推送最新数据到 live 分支
        if: steps.run.outputs.live == 'true'
        working-directory: live
        run: |
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "live $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live

      - name: 提交收盘数据
        if: steps.run.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "收盘数据 ${{ steps.day.outputs.date }}"
          git pull --rebase && git push

      - if: steps.run.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # GitHub Pages 提供网页本身和一份完整数据作备份；发布后要过几分钟才生效，所以不靠它传最新数据
  deploy:
    needs: update
    if: needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000

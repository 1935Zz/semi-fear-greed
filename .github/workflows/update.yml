name: 更新指数

# 主触发：cron-job.org 在美东 9–16 点定时调用 workflow_dispatch（force=false）。
# GitHub 自带的定时任务实测一天只触发了约 2 次，只留作备用。
# 是否真正更新由 ci.py 按纽交所日历判断（盘前、休市、收盘版已完成时直接跳过）。
# 改了代码或网页模板后推送到 main，会立即重新计算并发布一次。
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: 不管是否开盘都更新一次
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [semi_fgi.py, ci.py, stocks.py, template.html, template_stocks.html, requirements.txt, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  LIVE_URL: https://api.github.com/repos/${{ github.repository }}/contents/live.json?ref=live
  # 个股数据一小时最多变一次，用 raw 地址读（有约 5 分钟的缓存，但不占 GitHub API 每小时 60 次的额度）
  STOCKS_URL: https://raw.githubusercontent.com/${{ github.repository }}/stocks/stocks.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 新触发的运行直接取代还没算完的旧运行：数据只要最新的。收盘版如果被中途取代，下一次触发会重做
    concurrency:
      group: update
      cancel-in-progress: true
    outputs:
      live: ${{ steps.run.outputs.live }}
      pages: ${{ steps.run.outputs.pages }}
    steps:
      - uses: actions/checkout@v5

      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 依赖装在 .venv 里整体缓存，比每次 pip install 快约 10 秒
      - id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - id: day
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      # 历史行情每天全量下载一次，当天后续运行复用。只在真正完整下载后才保存（见下面的保存步骤）；
      # 不能用 actions/cache 自动保存：盘前跳过的运行会把前一天的数据存成当天的，之后全天都命中这份旧缓存
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: prices-${{ steps.day.outputs.date }}-
          restore-keys: |
            prices-${{ steps.day.outputs.date }}-
            prices-

      - id: run
        env:
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
        run: .venv/bin/python ci.py

      - if: steps.run.outputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: prices-${{ steps.day.outputs.date }}-${{ github.run_id }}

      # 网页读的就是这个分支上的 live.json。每次用一个新的单独提交强制覆盖，分支不积累历史
      - name: 推送最新数据到 live 分支
        if: steps.run.outputs.live == 'true'
        working-directory: live
        run: |
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "live $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live

      - name: 提交收盘数据
        if: steps.run.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "收盘数据 ${{ steps.day.outputs.date }}"
          git pull --rebase && git push

      - if: steps.run.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # 个股看盘：基本面每天第一次运行时刷新，新闻每小时刷新，结果推到 stocks 分支，网页直接读取。
  # 抓取要 1–3 分钟，所以单独成一个任务，不被每 3 分钟一次的指数更新取消，也不拖慢它
  stocks:
    needs: update
    if: needs.update.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: stocks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt

      - name: 读取上一次的个股数据
        run: |
          mkdir -p cache_stocks
          curl -sfL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/stocks.json?ref=stocks" \
            -o cache_stocks/stocks.json || rm -f cache_stocks/stocks.json

      - id: run
        env:
          FORCE: ${{ github.event_name == 'push' }}
        run: .venv/bin/python stocks.py --ci

      - name: 推送个股数据到 stocks 分支
        if: steps.run.outputs.changed == 'true'
        working-directory: stocks_out
        run: |
          git init -q -b stocks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git commit -q -m "stocks $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stocks

  # GitHub Pages 提供网页本身和一份完整数据作备份；发布后要过几分钟才生效，所以不靠它传最新数据
  deploy:
    needs: update
    if: needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 发布不被后面的计算打断；卡住时也只影响发布，不影响 live 分支上的最新数据
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
